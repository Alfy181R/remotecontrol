name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install kivy paramiko
          pip install git+https://github.com/kivy/python-for-android.git
          pip install git+https://github.com/kivy/buildozer.git

      - name: Fix sdkmanager and install NDK 25b
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/tools/bin/sdkmanager
          sudo mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee -a /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" | sudo tee /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" --sdk_root=/usr/local/lib/android/sdk

      - name: Build APK
        run: buildozer android debug 2>&1 | tee build_full.log || true

      - name: Show last error in log
        run: grep -i "error\|exception\|traceback\|failed" build_full.log | tail -30

      - name: Upload logs and APK
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build_full.log
            bin/*.apk
          if-no-files-found: warn
